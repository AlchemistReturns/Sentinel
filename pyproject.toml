[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous Codebase Auditor and Refactoring Agent"
authors = [
    { name = "Abrar Mahmud Hasan" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.4.1",
    "langchain-postgres>=0.0.17",
    "langgraph-checkpoint-postgres>=3.1.1",
    "pip-audit>=2.10.1",
    "prometheus-client>=0.26.0",
    "psycopg[binary]>=3.3.4",
    "pygithub>=2.9.1",
    "pytest>=9.1.1",
    "python-dotenv>=1.2.2",
    "redis>=8.1.0",
    "rq>=2.10.0",
    "ruff>=0.16.1",
    "semgrep>=1.172.0",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "websocket-client>=1.9.0",
]
