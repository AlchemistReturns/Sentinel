[project]
name = "sentinel"
version = "0.1.0"
description = "Autonomous Codebase Auditor and Refactoring Agent"
authors = [
    { name = "Abrar Mahmud Hasan" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "langchain>=1.3.14",
    "langchain-openai>=1.4.1",
    "langchain-postgres>=0.0.17",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "structlog>=26.1.0",
    "typer>=0.27.0",
    "uvicorn[standard]>=0.52.1",
]

[project.scripts]
sentinel = "sentinel.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
